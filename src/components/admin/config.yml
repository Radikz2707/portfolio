backend:
  name: proxy
  proxy_url: http://localhost:8082/api/v1
  repo: 'Radik/portfolio'
  branch: 'main'

local_backend: true

media_folder: 'src/images/blog'
public_folder: '/images/blog'

collections:
  - name: 'settings'
    label: '⚙️ Настройки Системы'
    delete: false
    files:
      - name: 'gulp_config'
        label: 'Конфигурация сборщика'
        file: 'src/content/system-settings.json'
        format: 'json'
        fields:
          - {
              label: '📁 Папка исходников (Source)',
              name: 'srcFolder',
              widget: 'string',
              default: 'src',
            }
          - {
              label: '📦 Папка сборки (Build/Dist)',
              name: 'buildFolder',
              widget: 'string',
              default: 'dist',
            }
          - {
              label: '🌐 URL Сайта (для Sitemap)',
              name: 'siteUrl',
              widget: 'string',
              default: 'https://radik.dev',
            }

      - name: 'blog_categories'
        label: '🗂️ Управление категориями'
        file: 'src/content/categories.json'
        format: 'json'
        fields:
          - label: 'Список всех категорий сайта'
            name: 'categories_list'
            widget: 'list'
            summary: '{{fields.title}} ({{fields.id}})'
            fields:
              - { label: 'Системный ID', name: 'id', widget: 'string' }
              - { label: 'Название на сайте', name: 'title', widget: 'string' }
