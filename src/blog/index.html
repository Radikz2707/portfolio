<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог | SITE_NAME</title>
    @@include("parts/favicon-links.html")
    <link rel="stylesheet" href="../css/app.min.css?v=1" />
  </head>
  <body class="page-blog">
    <div class="wrapper">
      @@include("components/header/header.html")
      @@include("components/menu/menu.html")

      <main class="blog-main">
        <section class="blog-hero">
          <div class="blog-hero__container container">
            <h1 class="blog-hero__title">Мой Блог</h1>
            <p class="blog-hero__subtitle">Выберите интересующую вас тему</p>

            <div class="blog-categories">
              <!-- Сюда Gulp автоматически вставит сгенерированные карточки категорий -->
              @@categories
            </div>
          </div>
        </section>
      </main>

      @@include("components/footer/footer.html")
    </div>
    <script src="../js/app.min.js" defer></script>
  </body>
</html>
