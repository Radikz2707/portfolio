<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой Блог — Статья</title>
    @@include('../../parts/favicon-links.html')
    <!-- 🔥 ИСПРАВЛЕНО: Поднимаемся на уровень выше из папки blog, чтобы найти стили -->
    <link rel="stylesheet" href="../css/app.min.css" />
  </head>
  <body>
    @@include('../../components/header/header.html')

    <article class="blog-article">
      <div class="blog-article__container container">
        <div class="blog-article__layout">
          <!-- Левая колонка: Текст текущей статьи -->
          <div class="blog-article__main-content">
            <a href="../index.html" class="blog-article__back-link"
              >&larr; Ко всем статьям</a
            >
            @@include('@@articleFile')
          </div>

          <!-- Правая колонка: ПОДКЛЮЧАЕМ НАШ НЕЗАВИСИМЫЙ КОМПОНЕНТ САЙДБАРА -->
          <div class="blog-article__sidebar">
            @@include('../../components/blog-sidebar/blog-sidebar.html')
          </div>
        </div>
      </div>
    </article>

    @@include('../../components/footer/footer.html')
    <!-- 🔥 ИСПРАВЛЕНО: Поднимаемся на уровень выше из папки blog, чтобы найти скрипты -->
    <script src="../js/app.min.js" defer></script>
  </body>
</html>
